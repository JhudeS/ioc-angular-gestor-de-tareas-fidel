<a class="skip-link" href="#main-content">Salta al contingut principal</a>

<div class="container">
  <header>
    <h1>{{ appName }}</h1>
    <p>
      Fidel Elvira · Aplicació per organitzar i fer el seguiment de les tasques
      diàries de forma senzilla.
    </p>
  </header>

  <main id="main-content" tabindex="-1">
    <app-task-filters
      [categories]="categories"
      (filtersApplied)="applyFilters($event)"
      (filtersReset)="resetFilters()"
    />

    <div class="content">
      <app-task-list
        [tasks]="filteredTasks"
        [totalTasks]="tasks.length"
        [selectedTaskId]="selectedTask?.id ?? null"
        (taskSelected)="selectTask($event)"
      />
      <app-task-detail [task]="selectedTask" />
    </div>
  </main>
</div>

<router-outlet />
